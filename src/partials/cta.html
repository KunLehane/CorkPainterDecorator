<section class="quote-strip">
  <div class="container quote-inner">
    <div>
      <h2>Get a price before we start</h2>
      <p>Tell us what needs painting, or send photos by WhatsApp. You get a written price by WhatsApp or email, and nothing starts until you say yes.</p>
    </div>
    <div class="quote-actions">
      <a class="btn btn-primary" href="/quote/">Request a quote</a>
      {{#WA_URL}}<a class="btn btn-ghost-light" href="{{WA_URL}}" rel="noopener" target="_blank">WhatsApp</a>{{/WA_URL}}
      {{#TEL_URL}}<a class="btn btn-ghost-light" href="{{TEL_URL}}">Call {{PHONE}}</a>{{/TEL_URL}}
    </div>
  </div>
</section>
